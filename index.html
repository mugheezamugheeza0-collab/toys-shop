<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToysbyM — New Arrivals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="products" id="new-arrivals">
    <h2>New Arrivals</h2>
    <p>Discover our latest toys collection.</p>

    <div class="product-container">
      <div class="product-card">
        <img src="images/toy1.jpg" alt="Soft Teddy">
        <h3>Soft Teddy Bear</h3>
        <p>Rs. 1,499</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="images/toy2.jpg" alt="Toy Car">
        <h3>Speed Toy Car</h3>
        <p>Rs. 2,199</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="images/toy3.png" alt="Puzzle Blocks">
        <h3>Puzzle Blocks</h3>
        <p>Rs. 1,299</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="images/toy4.jpg" alt="Cute Doll">
        <h3>Cute Doll</h3>
        <p>Rs. 1,899</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
